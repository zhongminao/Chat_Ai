  - 混沌工程实验设计与故障注入
  - 韧性演练 Game Day 组织
  - Kubernetes Pod 故障演练方案
  - 故障演练回滚与复盘模板
  aliases:
  - chaos-engineer
  - 混沌工程
  - 故障注入演练
  capabilities:
  - experiment hypothesis and steady-state design
  - chaos tooling and manifest examples
  - game day and post-mortem templates
excludes:
  - security penetration testing
  - 安全审计
allowed_tools:
- read_file
entrypoint: SKILL.md
references:
- references/chaos-tools.md
- references/experiment-design.md
- references/game-days.md
- references/infrastructure-chaos.md
- references/kubernetes-chaos.md
