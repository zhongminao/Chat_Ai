name: anthropics-skills__mcp-builder
version: 1.0.0
description: Development guide for building Model Context Protocol (MCP) servers in Python (FastMCP) or Node/TypeScript (MCP SDK), covering tool design, evaluation harnesses and best practices; bundled scripts need uninstalled mcp/anthropic packages.
delivery: search_result
triggers:
  intents:
  - build an MCP server exposing tools to LLMs
  - 开发一个 MCP server 并把内部服务封装成工具
  - design MCP tool names, schemas and error messages
  - write MCP server evaluation questions and run them
  - implement MCP server in TypeScript with the MCP SDK
  - 用 FastMCP 写 Python MCP 服务器
  aliases:
  - mcp-builder
  - MCP 服务器开发指南
  capabilities:
  - MCP server design and implementation guidance
  - MCP evaluation harness design
excludes:
  - 网页应用自动化测试
allowed_tools:
- read_file
entrypoint: SKILL.md
references:
- LOCAL_NOTES.md
- LICENSE.txt
- UPSTREAM_THIRD_PARTY_NOTICES.md
- reference/mcp_best_practices.md
- reference/python_mcp_server.md
- reference/node_mcp_server.md
- reference/node_mcp_server_v2.md
- reference/evaluation.md
- scripts/requirements.txt
