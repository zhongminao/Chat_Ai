name: openai-skills__cloudflare-deploy
version: 1.0.0
description: Cloudflare 平台选型与部署参考：用决策树判断该用 Workers/Pages/Durable Objects/Workflows/KV/D1/R2/Queues/Workers AI/AI Gateway/WAF/Tunnel
  等哪项服务，并给出 wrangler 认证、配置、绑定与常见问题的 60 组产品参考文档。
delivery: search_result
triggers:
  intents:
  - Cloudflare Workers 还是 Pages，Edge 应用该选哪个产品
  - wrangler 认证与 wrangler.toml 配置怎么写
  - Cloudflare KV / D1 / R2 / Queues 存储选型
  - Workers AI、Vectorize 与 AI Gateway 怎么接入
  - Cloudflare WAF、Turnstile 与 Bot Management 防护配置
  - deploy a Cloudflare Worker or Pages project with wrangler
  - Cloudflare Durable Objects 与 Workflows 适用场景
  aliases:
  - cloudflare-deploy
  - Cloudflare Workers 部署
  - wrangler 配置
  - Cloudflare 平台选型
  capabilities:
  - 60 类 Cloudflare 产品选型决策树
  - wrangler 认证/配置/绑定参考
  - 部署与运行时问题排查
allowed_tools:
- read_file
entrypoint: SKILL.md
