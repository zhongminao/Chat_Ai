name: jeffallan-claude-skills__database-optimizer
version: 1.1.1
description: Diagnose and fix slow database queries on PostgreSQL and MySQL — read EXPLAIN ANALYZE plans, design indexes, rewrite queries, tune server configuration, plan partitioning and reduce lock contention.
delivery: search_result
triggers:
  intents:
  - analyze a slow SQL query and its execution plan
  - design indexes for a slow query
  - tune PostgreSQL or MySQL configuration parameters
  - reduce lock contention and deadlocks
  - 慢查询分析与执行计划优化
  - 数据库索引设计建议
  - PostgreSQL 参数调优
  - MySQL 锁竞争与死锁排查
  aliases:
  - database-optimizer
  - 数据库性能优化
  - 慢查询优化
  capabilities:
  - execution plan analysis
  - index strategy design
  - database config tuning guidance
excludes:
  - 数据库表结构从零设计选型
allowed_tools:
- read_file
entrypoint: SKILL.md
references:
- references/index-strategies.md
- references/monitoring-analysis.md
- references/mysql-tuning.md
- references/postgresql-tuning.md
- references/query-optimization.md
- UPSTREAM_LICENSE
