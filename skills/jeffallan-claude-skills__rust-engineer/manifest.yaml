  - Rust 所有权与借用检查
  - Rust trait 设计与泛型
  - tokio 异步编程
  - run cargo clippy and fix warnings
  aliases:
  - rust-engineer
  - Rust 开发
  - Cargo 项目
allowed_tools:
- read_file
entrypoint: SKILL.md
references:
- references/async.md
- references/error-handling.md
- references/ownership.md
- references/testing.md
- references/traits.md
- UPSTREAM_LICENSE
- LOCAL_NOTES.md
excludes:
- C++20 模板与内存管理
- Dart 移动端开发
