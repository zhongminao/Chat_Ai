# API 供应商与模型目录。
default_provider: deepseek

providers:
  gpt:
    display_name: GPT (passion8.cc)
    api_key_default: gateway
    base_url: http://127.0.0.1:18100/gpt/v1
    thinking: disabled
    default_model: gpt-6.1-sol
    models:
    - id: gpt-6-sol
      name: gpt-6-sol
      reasoning_effort: high
      default_reasoning_effort: high
      image_generation: false
      chat_completions: true
    - id: codex-auto-review
      name: codex-auto-review
      image_generation: false
      chat_completions: true
    - id: gpt-6-astra
      name: gpt-6-astra
      reasoning_effort: medium
      default_reasoning_effort: medium
      image_generation: false
      chat_completions: true
    - id: gpt-6.1-sol
      name: gpt-6.1-sol
      reasoning_effort: high
      default_reasoning_effort: high
      image_generation: false
      chat_completions: true
    - id: gpt-5.6-terra
      name: gpt-5.6-terra
      reasoning_effort: medium
      default_reasoning_effort: medium
      image_generation: false
      chat_completions: true
    - id: gpt-5.6-sol
      name: gpt-5.6-sol
      reasoning_effort: medium
      default_reasoning_effort: medium
      image_generation: false
      chat_completions: true
  deepseek:
    display_name: DeepSeek
    api_key_default: gateway
    base_url: http://127.0.0.1:18100/deepseek/v1
    thinking: disabled
    default_model: deepseek-flash
    models:
    - id: deepseek-flash
      name: DeepSeek-V4.1-Flash
      vision: true
      reasoning_efforts:
      - low
      - high
      - max
      default_reasoning_effort: high
      api_default_reasoning_effort: high
      context_window: 1048576
      input_modalities:
      - text
      - image
    - id: deepseek-v4-pro
      name: DeepSeek-V4-Pro
      reasoning_efforts:
      - low
      - high
      - max
      api_default_reasoning_effort: high
      context_window: 1048576
      input_modalities:
      - text
      default_reasoning_effort: high
  local-qwen3-coder-30b:
    display_name: 本地 Qwen3-Coder-30B (llama.cpp · Q4)
    base_url: http://127.0.0.1:18080/v1
    default_model: qwen3-coder-30b
    token_counter: llama_cpp

