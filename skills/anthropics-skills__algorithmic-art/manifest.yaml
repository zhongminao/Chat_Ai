  - 生成算法艺术 .html 交互作品
  aliases:
  - algorithmic-art
  - p5.js 生成艺术
  capabilities:
  - p5.js generative art code guidance
  - algorithmic philosophy drafting
excludes:
  - 静态海报与 PDF 画布设计
  - 视频剪辑
allowed_tools:
- read_file
entrypoint: SKILL.md
references:
- LOCAL_NOTES.md
- LICENSE.txt
- UPSTREAM_THIRD_PARTY_NOTICES.md
- templates/generator_template.js
- templates/viewer.html
