# API 供应商连接、默认策略与人工模型覆盖；推理档位只读此文件，动态发现结果不写回。
default_provider: gpt

providers:
  gpt:
    display_name: GPT (passion8.cc)
    api_key_default: gateway
    base_url: http://127.0.0.1:18100/gpt/v1
    default_model: gpt-6.2-sol
    defaults:
      thinking: disabled
      # 只为已验证的模型配置可选档位。
      default_reasoning_effort: medium
    # 模型 ID -> 人工覆盖；未列出的模型继承 defaults，不维护发现的全量列表。
    models:
      gpt-6.2-sol:
        reasoning_efforts: &gpt_efforts [low, medium, high, xhigh]
        default_reasoning_effort: high
      gpt-6.1-sol:
        reasoning_efforts: *gpt_efforts
        vision: true
      gpt-6-sol:
        reasoning_efforts: *gpt_efforts
        default_reasoning_effort: high
        vision: true
      gpt-6-astra:
        reasoning_efforts: *gpt_efforts
        vision: true
      gpt-6.1-terra:
        reasoning_efforts: *gpt_efforts
        vision: true
      gpt-5.6-sol:
        reasoning_efforts: *gpt_efforts
        vision: true
      gpt-5.6-terra:
        reasoning_efforts: *gpt_efforts
        vision: true
      gpt-6.2-astra:
        reasoning_efforts: *gpt_efforts
      codex-auto-review:
        reasoning_efforts: *gpt_efforts
  deepseek:
    display_name: DeepSeek
    api_key_default: gateway
    base_url: http://127.0.0.1:18100/deepseek/v1
    default_model: deepseek-flash
    defaults:
      thinking: disabled
    models:
      deepseek-flash:
        reasoning_efforts: &deepseek_efforts [none, low, high, max]
        default_reasoning_effort: none
        vision: true
      deepseek-v4-pro:
        reasoning_efforts: *deepseek_efforts
        default_reasoning_effort: none
  local-qwen3-coder-30b:
    display_name: 本地 Qwen3-Coder-30B (llama.cpp · Q4)
    base_url: http://192.168.250.1:18080/v1
    default_model: qwen3-coder-30b
    token_counter: llama_cpp

  local-qwen3p5-9b:
    display_name: 本地 Qwen3.5-9B (vLLM · FP8)
    base_url: http://192.168.250.1:18081/v1
    default_model: local-qwen3p5-9b
    defaults:
      vision: true

  local-qwen3p6-35b:
    display_name: 本地 Qwen3.6-35B-A3B (Strata · Q4)
    base_url: http://192.168.250.1:18082/v1
    default_model: Qwen3.6-35B-A3B
    defaults:
      vision: true
