  - 前端测试基建搭建
  aliases:
  - javascript-testing-patterns
  - jest vitest
  - JS 单元测试
  capabilities:
  - Jest/Vitest configuration
  - component testing with Testing Library
  - mocking and coverage thresholds
allowed_tools:
- read_file
entrypoint: SKILL.md
references:
- SKILL.md
- UPSTREAM_LICENSE
- references/advanced-testing-patterns.md
- LOCAL_NOTES.md
excludes:
- E2E 测试方案
- pytest 用例编写
- 测试策略与覆盖率规划
- react 状态管理
- react 架构迁移
- typecheck 脚本
notes: 与 jeffallan-claude-skills__test-master 分工：本技能聚焦 JS/TS 测试框架的具体配置与用例写法。
