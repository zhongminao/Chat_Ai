name: jeffallan-claude-skills__debugging-wizard
version: 1.1.0
description: Diagnose bugs systematically — reproduce an error, read stack traces and logs, isolate the failing case, test one hypothesis at a time and add a regression test after the fix.
delivery: search_result
triggers:
  intents:
  - debug this error
  - analyze a stack trace
  - root cause analysis of a crash
  - why is my code not working
  - 排查报错
  - 分析堆栈信息找根因
  - 调试崩溃问题
  aliases:
  - debugging-wizard
  - bug 定位
  - 调试助手
  capabilities:
  - hypothesis-driven debugging
  - stack trace and log analysis
  - regression test after fix
excludes:
  - 代码审查
  - code review
allowed_tools:
- read_file
entrypoint: SKILL.md
references:
- references/common-patterns.md
- references/debugging-tools.md
- references/quick-fixes.md
- references/strategies.md
- references/systematic-debugging.md
- UPSTREAM_LICENSE
