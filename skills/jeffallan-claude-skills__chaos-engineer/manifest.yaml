name: jeffallan-claude-skills__chaos-engineer
version: 1.1.0
description: Design chaos experiments and game days for distributed systems — hypothesis and steady-state definition, blast-radius controls, failure injection manifests (Litmus/Chaos Mesh), rollback procedures and post-mortem templates.
delivery: search_result
triggers:
