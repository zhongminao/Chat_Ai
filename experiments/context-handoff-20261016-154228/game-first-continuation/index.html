<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>星港回收站</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <div class="header">
      <h1>星港回收站</h1>
      <div class="status">
        <span>HP: <span id="hp">5</span></span>
        <span>能量: <span id="energy">12</span></span>
        <span>芯片: <span id="chips">0</span>/3</span>
        <span>回合: <span id="turn">0</span></span>
      </div>
      <div class="controls">
        <button id="resetBtn">重开游戏</button>
        <input type="text" id="seedInput" placeholder="输入种子" value="ORBIT-2049">
        <button id="loadSeedBtn">加载种子</button>
        <button id="saveSlot1">保存到槽位1</button>
        <button id="loadSlot1">从槽位1读取</button>
      </div>
    </div>

    <div class="game-area">
      <canvas id="gameCanvas" width="576" height="384"></canvas>
      <div class="touch-controls">
        <div class="direction-pad">
          <button class="dir-btn" data-dir="0,-1">↑</button>
          <button class="dir-btn" data-dir="-1,0">←</button>
          <button class="dir-btn" data-dir="0,1">↓</button>
          <button class="dir-btn" data-dir="1,0">→</button>
        </div>
        <button id="waitBtn">等待(Z)</button>
      </div>
    </div>

    <div class="replay-controls">
      <h3>回放控制</h3>
      <button id="exportReplay">导出回放</button>
      <button id="importReplay">导入回放</button>
      <textarea id="replayText" placeholder="粘贴回放JSON"></textarea>
    </div>
  </div>

  <script src="ui.js"></script>
</body>
</html>
