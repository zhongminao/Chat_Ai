# API 供应商与模型目录。
default_provider: deepseek

providers:
  gpt:
    display_name: GPT (passion8.cc)
    api_key_default: gateway
    base_url: http://127.0.0.1:18100/gpt/v1
    thinking: disabled
    default_model: gpt-6.1-sol
    models:
      - id: gpt-5.5
        name: GPT-5.5
        reasoning_effort: medium
      - id: gpt-5.6-terra
        name: GPT-5.6 Terra
        reasoning_effort: medium
      - id: gpt-5.6-sol
        name: GPT-5.6 Sol
        reasoning_effort: medium
      - id: gpt-6-astra
        name: GPT-6 Astra
        reasoning_effort: medium
      - id: gpt-6.1-sol
        name: GPT-6.1 Sol
        reasoning_effort: high
      - id: gpt-6-sol
        name: GPT-6 Sol
        reasoning_effort: high


  deepseek:
    display_name: DeepSeek
    api_key_default: gateway
    base_url: http://127.0.0.1:18100/deepseek/v1
    thinking: disabled
    default_model: deepseek-flash
    models:
      - id: deepseek-flash
        name: DeepSeek Flash
        vision: true

  local-qwen3p5-9b:
    display_name: 本地 Qwen3.5-9B (vLLM · FP8)
    api_key_env: LOCAL_QWEN_API_KEY
    api_key_default: local-qwen3p5-9b
    base_url: http://127.0.0.1:8002/v1
    thinking: disabled
    default_model: local-qwen3p5-9b
    models:
      - id: local-qwen3p5-9b
        name: Qwen3.5-9B 本地
        vision: true
        max_images: 50

  local-qwen3-coder-30b:
    display_name: 本地 Qwen3-Coder-30B (llama.cpp · Q4)
    api_key_env: LOCAL_QWEN3_CODER_API_KEY
    api_key_default: local
    base_url: http://127.0.0.1:18080/v1
    base_url_env: LOCAL_QWEN3_CODER_BASE_URL
    thinking: disabled
    token_counter: llama_cpp
    default_model: qwen3-coder-30b
    models:
      - id: qwen3-coder-30b
        name: Qwen3-Coder-30B 本地
        vision: false

  local-qwen3p6-35b:
    display_name: 本地 Qwen3.6-35B-A3B (Strata · Q4)
    api_key_env: LOCAL_QWEN3P6_API_KEY
    api_key_default: local
    base_url: http://127.0.0.1:8003/v1
    base_url_env: LOCAL_QWEN3P6_BASE_URL
    thinking: disabled
    default_model: Qwen3.6-35B-A3B-128K
    models:
      - id: Qwen3.6-35B-A3B-128K
        name: Qwen3.6-35B-A3B 本地
        vision: true
        max_images: 50
