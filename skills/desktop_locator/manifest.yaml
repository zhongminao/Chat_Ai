name: desktop_locator
version: 0.1.0
description: In-memory multi-session visual desktop task skill with screenshot descriptions, target location, plan and verification; Windows action adapter is opt-in.
delivery: search_result
triggers:
  intents:
    - desktop locator
    - locate UI element
    - screenshot coordinate
    - accessibility tree coordinate
    - 桌面定位
    - 截图坐标定位
    - 无障碍树定位
  aliases:
    - AX
    - vision grounding
    - UI 坐标
  capabilities:
    - exact unique AX name role matching
    - OpenAI-compatible vision coordinate localization
    - screenshot token
    - cursor-composited Windows capture
    - one-shot locate preview
    - in-memory concurrent visual task sessions
    - image description and context overflow feedback
    - explicit guarded mouse move and click on Windows
excludes:
  - unattended clicking
allowed_tools:
  - run_bash
entrypoint: SKILL.md
references:
  - WINDOWS_WORKFLOW.md
