<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>对话</title>
<style>
:root { --composer-mask-height: 140px; color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100%; overflow: hidden; background: #fff; color: #0f1115; }
.layout { display: flex; height: 100dvh; }
aside { width: 280px; height: 100dvh; flex: none; padding: 6px 12px; background: #f9fafb; border-right: 1px solid #e9ecf2; overflow-y: auto; }
aside h2 { height: 48px; margin: 0 0 8px; padding: 8px 8px 8px 4px; display: flex; align-items: center; font-size: 15px; font-weight: 600; color: #0f1115; }
.model-menu { position: relative; display: inline-flex; min-width: 0; }
.model-chip { display: inline-flex; align-items: center; gap: 6px; max-width: 220px; height: 28px; padding: 0 9px; color: #53565c; background: transparent; border: 0; border-radius: 16px; cursor: pointer; font: inherit; font-size: 13px; }
.model-chip:hover:not(:disabled) { background: #f1f3f5; }
.model-chip:disabled { color: #a1a4aa; cursor: default; }
.model-chip-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.model-chip-chevron { width: 6px; height: 6px; margin-top: -3px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg); }
.model-popup { position: absolute; left: 0; bottom: calc(100% + 8px); z-index: 20; width: 240px; max-height: min(320px, 50vh); overflow-y: auto; padding: 5px; background: #fff; border: 1px solid #e1e4e8; border-radius: 12px; box-shadow: 0 8px 28px rgba(15,17,21,.16); }
.model-group-title { padding: 7px 9px 4px; color: #81858c; font-size: 12px; }
.model-option { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 8px 9px; color: #353638; background: transparent; border: 0; border-radius: 8px; cursor: pointer; font: inherit; text-align: left; }
.model-option:hover, .model-option.is-selected { background: #f1f3f5; }
.model-option-check { color: #353638; visibility: hidden; }
.model-option.is-selected { background: #f1f3f5; }
.model-option:disabled { color: #a1a4aa; cursor: default; }
.session { width: 100%; min-width: 0; padding: 9px 8px; text-align: left; color: #353638; background: transparent; border: 0; border-radius: 8px; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.session-row { display: flex; gap: 4px; align-items: stretch; margin-bottom: 2px; }
.session-row .session { flex: 1; }
.session-title { display: block; overflow: hidden; text-overflow: ellipsis; }
.session small { display: block; margin-top: 4px; font-size: 12px; color: #81858c; }
.session:hover { background: #f1f3f5; }
.session.active { background: #ebeef2; color: #0f1115; }
.delete-session { width: 28px; border: 0; border-radius: 8px; color: #81858c; background: transparent; cursor: pointer; }
.delete-session:hover { color: #ef4444; background: #fef2f2; }
main { flex: 1 1 auto; width: auto; min-width: 0; height: 100dvh; overflow: hidden; padding: 24px 20px 0; display: flex; flex-direction: column; gap: 12px; }
#messages { flex: 1 1 auto; min-height: 0; width: 100%; overflow-y: auto; scrollbar-gutter: stable; padding: 16px 0 30px; }
#message-content { width: min(820px, 100%); margin: 0 auto; display: flex; flex-direction: column; gap: 16px; padding: 0 16px 20px; }
.message { max-width: min(748px, 82%); padding: 0; border-radius: 0; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.75; font-size: 16px; }
.user { align-self: flex-end; max-width: min(525px, 82%); padding: 10px 16px; border-radius: 22px; background: #edf3fe; line-height: 1.5; }
.assistant { align-self: flex-start; color: #0f1115; }
.tool { align-self: flex-start; max-width: min(748px, 82%); color: #53565c; }
.tool details { background: #f5f6f7; border: 1px solid #e9ecf2; border-radius: 12px; padding: 10px 14px; }
.tool summary { cursor: pointer; list-style: none; }
.tool summary::-webkit-details-marker { display: none; }
.tool summary::before { content: "⚙"; margin-right: 8px; color: #81858c; }
.tool pre { margin: 12px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; color: #53565c; }
.composer { flex: none; display: flex; flex-direction: column; width: min(780px, 100%); margin: auto auto 8px; padding: 10px 12px 12px; border: 1px solid rgba(0,0,0,.1); border-radius: 22px; background: #fff; box-shadow: 0 4px 16px rgba(15,17,21,.08); }
textarea { display: block; width: 100%; min-height: 72px; max-height: 220px; padding: 2px 4px; color: #0f1115; background: transparent; border: 0; outline: none; resize: none; font: inherit; font-size: 16px; line-height: 24px; }
textarea::placeholder { color: #a1a4aa; }
.composer-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-top: 8px; }
button.send { padding: 8px 16px; color: #fff; background: #0f1115; border: 0; border-radius: 18px; cursor: pointer; font: inherit; font-size: 14px; }
button.send:hover:not(:disabled) { background: #43454a; }
button.send:disabled { opacity: .4; cursor: default; }
#status { position: fixed; top: 0; right: 0; width: 180px; height: 100dvh; padding: 18px 14px; color: #81858c; font-size: 12px; text-align: right; pointer-events: none; }
@media (max-width: 900px) { aside { width: 220px; } main { padding: 16px 12px 0; } #status { width: 140px; padding-right: 8px; } #message-content { padding-left: 8px; padding-right: 8px; } }
</style>
</head>
<body>
<div class="layout">
<aside><h2>历史会话</h2><button id="new-session" class="session">＋ 新会话</button><div id="sessions"></div></aside>
<main>
<div id="messages" role="log" aria-label="对话"><div id="message-content"></div></div>
<form class="composer">
<textarea id="input" rows="3" placeholder="输入消息，Enter 发送，Shift+Enter 换行" aria-label="消息"></textarea>
<div class="composer-actions"><div class="model-menu"><button type="button" id="model-chip" class="model-chip" aria-haspopup="menu" aria-expanded="false"><span id="model-chip-name" class="model-chip-name">选择模型</span><span class="model-chip-chevron" aria-hidden="true"></span></button><div id="model-popup" class="model-popup" role="menu" hidden></div></div><button class="send" id="send" disabled>发送</button></div>
</form>
</main>
<div id="status" role="status">正在连接…</div>
</div>
<script>const scrollBox = document.querySelector("#messages"), box = document.querySelector("#message-content"), input = document.querySelector("#input");
const send = document.querySelector("#send"), status = document.querySelector("#status");
const modelChip = document.querySelector("#model-chip"), modelChipName = document.querySelector("#model-chip-name"), modelPopup = document.querySelector("#model-popup");
let modelGroups = [], currentModel = null;
const sessionsBox = document.querySelector("#sessions");
let assistant = null, busy = false, connected = false, selected = null, events = null;
let selection = 0;
const tools = new Map();
const refresh = () => {
  send.disabled = !connected || !selected || (!busy && !input.value.trim());
  send.textContent = busy ? "暂停" : "发送";
  modelChip.disabled = busy || !selected;
};
const scroll = () => { scrollBox.scrollTop = scrollBox.scrollHeight; };
async function api(path, options) {
  const response = await fetch(path, options);
  if (!response.ok) throw new Error(await response.text());
  return response.json();
}
function message(role, text = "") {
  const element = document.createElement("div");
  element.className = "message " + role;
  element.textContent = text; box.append(element); scroll(); return element;
}
function toolMessage(name, args) {
  const wrapper = document.createElement("div"); wrapper.className = "tool";
  const details = document.createElement("details"), summary = document.createElement("summary");
  summary.textContent = name; const body = document.createElement("pre");
  body.textContent = args ? JSON.stringify(args, null, 2) : "";
  details.append(summary, body); wrapper.append(details); box.append(wrapper); scroll(); return body;
}
function renderHistory(messages) {
  box.replaceChildren(); assistant = null; tools.clear();
  for (const item of messages) {
    if (item.role === "user") message("user", item.content || "");
    if (item.role === "assistant") {
      if (item.content) message("assistant", item.content);
      for (const call of item.tool_calls || []) {
        let args = call.function.arguments;
        try { args = JSON.parse(args); } catch {}
        tools.set(call.id, toolMessage(call.function.name, args));
      }
    }
    if (item.role === "tool") {
      const element = tools.get(item.tool_call_id) || toolMessage(item.name || "工具", null);
      element.textContent += "\n\n工具结果\n" + (item.content || "");
    }
  }
}
const time = value => value ? new Date(value).toLocaleString("zh-CN", {hour12: false}) : "";
function setModelValue(provider, model) {
  currentModel = {provider, model};
  const group = modelGroups.find(item => item.provider === provider);
  const item = group?.models.find(entry => entry.id === model);
  modelChipName.textContent = item?.name || model;
  for (const option of modelPopup.querySelectorAll(".model-option"))
    option.classList.toggle("is-selected", option.dataset.provider === provider && option.dataset.model === model);
}
async function chooseModel(provider, model) {
  if (!selected || busy) return;
  try {
    await api("/api/sessions/" + encodeURIComponent(selected) + "/model", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({provider, model})
    });
    setModelValue(provider, model); modelPopup.hidden = true; modelChip.setAttribute("aria-expanded", "false");
    status.textContent = "已切换模型";
    setTimeout(() => { if (!busy) status.textContent = ""; }, 1200);
  } catch (error) { showError(error); }
}
async function loadModels() {
  const data = await api("/api/models");
  modelGroups = data.models;
  modelPopup.replaceChildren();
  for (const provider of modelGroups) {
    const title = document.createElement("div"); title.className = "model-group-title"; title.textContent = provider.displayName; modelPopup.append(title);
    for (const model of provider.models) {
      const option = document.createElement("button"); option.type = "button"; option.className = "model-option"; option.disabled = model.enabled === false; option.dataset.provider = provider.provider; option.dataset.model = model.id;
      const name = document.createElement("span"); name.textContent = model.name; option.append(name);
      const check = document.createElement("span"); check.className = "model-option-check"; check.textContent = model.enabled === false ? "" : "✓"; option.append(check);
      option.onclick = () => chooseModel(provider.provider, model.id);
      modelPopup.append(option);
    }
  }
  if (currentModel) setModelValue(currentModel.provider, currentModel.model);
}
modelChip.onclick = () => {
  if (modelChip.disabled) return;
  modelPopup.hidden = !modelPopup.hidden;
  modelChip.setAttribute("aria-expanded", String(!modelPopup.hidden));
};
document.addEventListener("click", event => {
  if (!event.target.closest(".model-menu")) { modelPopup.hidden = true; modelChip.setAttribute("aria-expanded", "false"); }
});


async function loadSessions() {
  const data = await api("/api/sessions");
  sessionsBox.replaceChildren();
  for (const item of data.sessions) {
    const row = document.createElement("div");
    row.className = "session-row";
    const button = document.createElement("button");
    button.className = "session" + (item.id === selected ? " active" : "");
    const title = document.createElement("span");
    title.className = "session-title"; title.textContent = item.title;
    const date = document.createElement("small");
    date.textContent = time(item.updatedAt * 1000);
    button.title = item.title + "\n创建：" + time(item.createdAt) +
      "\n最近更新：" + time(item.updatedAt * 1000);
    button.append(title, date);
    button.onclick = () => selectSession(item.id).catch(showError);
    const remove = document.createElement("button");
    remove.className = "delete-session"; remove.textContent = "×";
    remove.title = "删除会话";
    remove.onclick = event => { event.stopPropagation(); deleteSession(item.id).catch(showError); };
    row.append(button, remove);
    sessionsBox.append(row);
  }
  return data.sessions;
}
function showError(error) {
  status.textContent = error.message;
  refresh();
}
async function deleteSession(id) {
  if (!confirm("删除这个历史会话？")) return;
  await api("/api/sessions/" + encodeURIComponent(id), {method: "DELETE"});
  if (id === selected) {
    events?.close(); selected = null; connected = false;
    const session = await api("/api/sessions", {method: "POST"});
    await selectSession(session.id);
  } else {
    await loadSessions();
  }
}
async function selectSession(id) {
  const version = ++selection;
  events?.close();
  connected = false; busy = false; selected = null;
  input.value = ""; status.textContent = "加载会话…"; refresh();
  const snapshot = await api("/api/sessions/" + encodeURIComponent(id) + "/conversation");
  if (version !== selection) return;
  selected = id; localStorage.setItem("chat.session", id);
  if (snapshot.model) setModelValue(snapshot.model.provider, snapshot.model.name);
  busy = snapshot.busy; renderHistory(snapshot.messages);
  const source = new EventSource("/api/sessions/" + encodeURIComponent(id) + "/events?after=" + snapshot.seq);
  events = source;
  source.onopen = () => {
    if (version !== selection) return;
    connected = true; status.textContent = busy ? "正在回复…" : ""; refresh();
  };
  source.onerror = () => {
    if (version !== selection) return;
    connected = false; status.textContent = "连接中断，正在重连…"; refresh();
  };
  source.onmessage = event => {
    if (version !== selection) return;
    const data = JSON.parse(event.data);
    if (data.type === "model.changed") {
      setModelValue(data.new.provider, data.new.name);
      status.textContent = "已切换模型";
    }
    if (data.type === "turn.started") {
      message("user", data.prompt || ""); assistant = null; busy = true;
      status.textContent = "正在回复…";
    }
    if (data.type === "model.started") assistant = null;
    if (data.type === "message.delta") {
      if (!assistant) assistant = message("assistant");
      assistant.textContent += data.text; scroll();
    }
    if (data.type === "tool.requested")
      tools.set(data.callId, toolMessage(data.tool, data.arguments));
    if (data.type === "tool.completed") {
      const element = tools.get(data.callId) || toolMessage(data.tool, null);
      element.textContent += "\n\n工具结果\n" + String(data.result || "");
      scroll();
    }
    if (data.type === "turn.completed") {
      busy = false; assistant = null; status.textContent = "";
      loadSessions().catch(showError);
    }
    if (data.type === "turn.cancelled") {
      busy = false; assistant = null; status.textContent = "";
      loadSessions().catch(showError);
    }
    if (data.type === "turn.failed" || data.type === "error") {
      busy = false; assistant = null;
      status.textContent = "回复失败：" + (data.reason || data.message);
    }
    refresh();
  };
  await loadSessions();
}
document.querySelector("#new-session").onclick = async () => {
  try {
    const session = await api("/api/sessions", {method: "POST"});
    await selectSession(session.id);
  } catch (error) { showError(error); }
};
input.oninput = refresh;
document.querySelector("form").onsubmit = async event => {
  event.preventDefault(); if (send.disabled) return;
  const id = selected, version = selection;
  if (busy) {
    status.textContent = "正在停止…"; refresh();
    try {
      await api("/api/sessions/" + encodeURIComponent(id) + "/control/stop", {method: "POST"});
    } catch (error) {
      if (version === selection) showError(error);
    }
    refresh();
    return;
  }
  const content = input.value;
  busy = true; status.textContent = "正在发送…"; refresh();
  try {
    await api("/api/sessions/" + encodeURIComponent(id) + "/messages", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({content})
    });
    if (version === selection && input.value === content) input.value = "";
  } catch (error) {
    if (version === selection) { busy = false; showError(error); }
  }
  refresh();
};
input.onkeydown = event => {
  if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
    event.preventDefault(); if (!send.disabled) document.querySelector("form").requestSubmit();
  }
};
(async () => {
  try {
    await loadModels();
    const items = await loadSessions();
    const saved = localStorage.getItem("chat.session");
    let id = items.find(item => item.id === saved)?.id || items[0]?.id;
    if (!id) id = (await api("/api/sessions", {method: "POST"})).id;
    await selectSession(id);
  } catch (error) { showError(error); }
})();

</script>
</body>
</html>
