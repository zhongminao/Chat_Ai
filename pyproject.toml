[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chat-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.0",
  "PyYAML>=6.0",
  "fastapi>=0.100",
  "uvicorn>=0.30",
  "mcp>=2.3.0,<3",
  "Pillow>=11.0",
  "python-multipart>=0.0.20",
  "prompt_toolkit>=3.0",
  "akshare==1.20.25",
  "aktools==0.1.4",
]

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.setuptools.package-data]
"agent.web" = ["frontend/dist/index.html", "frontend/dist/assets/*"]
