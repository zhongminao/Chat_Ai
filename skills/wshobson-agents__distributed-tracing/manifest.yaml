  - OpenTelemetry instrumentation
  - context propagation
  - Jaeger/Tempo setup
allowed_tools:
- read_file
entrypoint: SKILL.md
references:
- SKILL.md
- UPSTREAM_LICENSE
- references/details.md
- LOCAL_NOTES.md
excludes:
- prometheus 指标采集配置
- SLO 错误预算
- grafana 面板设计
- python 日志埋点规范
- 服务网格流量管理
