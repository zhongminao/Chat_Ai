name: jeffallan-claude-skills__rust-engineer
version: 1.1.0
description: Write idiomatic Rust - ownership, borrowing and lifetimes, trait hierarchies, Result/Option error handling, async with tokio and clippy-driven cleanup.
delivery: search_result
triggers:
