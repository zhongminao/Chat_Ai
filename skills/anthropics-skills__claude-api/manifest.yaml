name: anthropics-skills__claude-api
version: 1.0.0
description: Claude API / Anthropic SDK 参考手册：模型 ID 与定价、参数、流式、工具调用、MCP、Managed Agents、提示缓存、token 计数、成本优化与模型迁移，覆盖 Python/TypeScript/Go/Java/C#/PHP/Ruby/cURL。
delivery: search_result
triggers:
  intents:
  - Claude API 和 Anthropic SDK 怎么用 / 模型 id 与参数
  - 如何调用 Claude 实现流式输出与工具调用 tool use
  - Claude 提示缓存 prompt caching 与 token 计数、成本优化
  - 把现有代码迁移到新 Claude 模型 model migration
  - build an LLM app with Anthropic SDK in python or typescript
  - Claude Managed Agents 与 MCP 集成方案
  - Anthropic API key 配置与错误码排查
  aliases:
  - claude-api
  - Anthropic SDK 参考
  - Claude 模型选型
  - Claude API 密钥配置
  capabilities:
  - 八种语言 SDK 用法与参数表
  - 模型定价/缓存/成本与迁移指南
  - Managed Agents 与工具调用模式
excludes:
- OpenAI / GPT / Gemini 等其他厂商模型开发
- 生成课程推荐
- PDF 与办公文档处理
allowed_tools:
- read_file
entrypoint: SKILL.md
