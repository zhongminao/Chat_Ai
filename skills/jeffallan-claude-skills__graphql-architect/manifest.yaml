name: jeffallan-claude-skills__graphql-architect
version: 1.1.0
description: Design GraphQL schemas and Apollo Federation subgraphs - entity directives, DataLoader resolvers, schema-first design, subscriptions and query complexity limits.
delivery: search_result
triggers:
