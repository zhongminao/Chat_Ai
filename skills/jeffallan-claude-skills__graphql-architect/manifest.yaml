  - graphql-architect
  - GraphQL 架构
  - Apollo Federation
  - GraphQL 联合类型设计
allowed_tools:
- read_file
entrypoint: SKILL.md
references:
- references/federation.md
- references/migration-from-rest.md
- references/resolvers.md
- references/schema-design.md
- references/security.md
- references/subscriptions.md
- UPSTREAM_LICENSE
- LOCAL_NOTES.md
