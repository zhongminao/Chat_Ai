name: wshobson-agents__javascript-testing-patterns
version: 1.0.0
description: 'Write JavaScript/TypeScript tests with Jest, Vitest and Testing Library: mocking, fixtures,
  component tests and TDD/BDD workflow in CI.'
delivery: search_result
triggers:
  intents:
  - jest 配置与用例编写
  - vitest 单元测试设置
  - react testing library 组件测试
  - vi.mock 与 spyOn 打桩
  - typescript 测试类型与覆盖率阈值
