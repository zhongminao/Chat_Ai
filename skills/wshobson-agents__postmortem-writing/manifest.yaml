name: wshobson-agents__postmortem-writing
version: 1.0.0
description: Write blameless postmortems with incident timelines, root cause and contributing factor analysis,
  and tracked action items that prevent recurrence.
delivery: search_result
triggers:
  intents:
  - 故障复盘文档怎么写
  - blameless postmortem 模板
  - 事故时间线与根因分析
  - 复盘改进项与行动项跟踪
  - 线上故障事后回顾会议主持
  - 总结事故经验防止再次发生
  aliases:
  - postmortem-writing
  - 故障复盘
  - postmortem
  capabilities:
  - blameless postmortem structure
  - timeline and root cause analysis
  - action item tracking
allowed_tools:
- read_file
entrypoint: SKILL.md
references:
- SKILL.md
- UPSTREAM_LICENSE
- references/details.md
excludes:
- 编写故障应急 runbook
- on-call 交接班
- 会议纪要整理
- SLO 错误预算
- 数据库数据恢复取证
