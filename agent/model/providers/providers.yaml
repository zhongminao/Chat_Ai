# API 供应商连接、默认策略与人工模型覆盖；动态发现结果不写回此文件。
default_provider: deepseek

providers:
  gpt:
    display_name: GPT (passion8.cc)
    api_key_default: gateway
    base_url: http://127.0.0.1:18100/gpt/v1
    default_model: gpt-6.1-sol
    defaults:
      thinking: disabled
      # GPT 网关的 /models 不返回 reasoning 能力；这里是人工策略，非探测结果。
      default_reasoning_effort: medium
    # 模型 ID -> 人工覆盖；未列出的模型继承 defaults，不维护发现的全量列表。
    models:
      gpt-6.1-sol:
        default_reasoning_effort: high
      gpt-6-sol:
        default_reasoning_effort: high
  deepseek:
    display_name: DeepSeek
    api_key_default: gateway
    base_url: http://127.0.0.1:18100/deepseek/v1
    default_model: deepseek-flash
    defaults:
      thinking: disabled
      reasoning_efforts: [low, high, max]
      default_reasoning_effort: high
    models:
      deepseek-flash:
        vision: true
  local-qwen3-coder-30b:
    display_name: 本地 Qwen3-Coder-30B (llama.cpp · Q4)
    base_url: http://192.168.250.1:18080/v1
    default_model: qwen3-coder-30b
    token_counter: llama_cpp

  local-qwen3p5-9b:
    display_name: 本地 Qwen3.5-9B (vLLM · FP8)
    base_url: http://192.168.250.1:18081/v1
    default_model: local-qwen3p5-9b
    defaults:
      vision: true

  local-qwen3p6-35b:
    display_name: 本地 Qwen3.6-35B-A3B (Strata · Q4)
    base_url: http://192.168.250.1:18082/v1
    default_model: Qwen3.6-35B-A3B
    defaults:
      vision: true
