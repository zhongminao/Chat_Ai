  aliases:
  - turborepo-caching
  - Turborepo
  - turbo 缓存
  capabilities:
  - pipeline task graph
  - remote caching setup
  - cache miss debugging
allowed_tools:
- read_file
entrypoint: SKILL.md
references:
- SKILL.md
- UPSTREAM_LICENSE
- LOCAL_NOTES.md
excludes:
- nx 工作区项目边界
- 通用 monorepo 管理
- github actions 模板
- 云成本优化
