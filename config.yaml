# CLI 与 Web 共用的项目配置。
workspace: ./workspace
storage_dir: ./storage
providers_file: ./agent/model/providers/providers.yaml

# 每次用户请求或子 Agent 任务的模型调用轮数上限。
max_rounds: 200

# 新主会话默认使用审计；可在 Web 或 CLI 切换，共用于该会话的子 Agent。
approval:
  mode: audit

# 每次业务模型请求前检查；与 max_rounds 独立，整理仍在同一个会话中。
context:
  enabled: true
  # 所有模型默认的整理触发阈值（不是模型最大上下文）。
  trigger_tokens: 256000
  # 指定 provider 覆盖默认整理阈值；本地部署按实际上下文填写。
  model_trigger_tokens:
    local-qwen3-coder-30b: 64000
  prompt_file: ./prompts/context_compaction.md


spill:
  enabled: true
  max_inline_chars: 12000
  preview_chars: 4000
  directory: .spill

mcp:
  remote_windows: http://127.0.0.1:8767/mcp
  web: http://127.0.0.1:8766/mcp


# 主、子 Agent 完整提示词文件；{workspace} 在装配时替换为工作区绝对路径。
system_prompt_file: ./prompts/main_agent.md
child_system_prompt_file: ./prompts/child_agent.md
