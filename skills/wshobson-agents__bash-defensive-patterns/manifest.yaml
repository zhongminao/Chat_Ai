name: wshobson-agents__bash-defensive-patterns
version: 1.0.0
description: Write bash 严格模式生产级 shell 脚本：set -Eeuo pipefail 严格模式、trap 陷阱清理、全变量引用、参数校验、mktemp 临时文件与幂等重跑设计。
delivery: search_result
triggers:
  intents:
  - bash 防空脚本严格模式 set -Eeuo pipefail 写法
  - trap ERR EXIT 清理函数与错误捕获
  - shell 变量引用与数组防单词分割
  - bash 参数校验与输入合法性检查
  - mktemp 临时文件与安全清理
  - bash 幂等可重复执行脚本设计
  - shell 结构化日志与 dry-run 模式
  aliases:
  - bash-defensive-patterns
  - defensive bash 写法
  - 健壮性 shell 脚本
  capabilities:
  - strict mode and error trapping
  - input validation and quoting
  - idempotent script design
allowed_tools:
- read_file
entrypoint: SKILL.md
references:
- SKILL.md
- UPSTREAM_LICENSE
- references/details.md
- LOCAL_NOTES.md
excludes:
- shell 脚本静态检查 shellcheck 规则
- bash 单元测试 bats 框架
- CI/CD 流水线编排设计
- 命令行工具脚手架生成
