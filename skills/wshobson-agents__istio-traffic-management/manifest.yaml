name: wshobson-agents__istio-traffic-management
version: 1.0.0
description: 'Manage Istio traffic with VirtualService, DestinationRule and Gateway: canary and blue-green
  routing, retries, timeouts, circuit breaking and mirroring.'
delivery: search_result
triggers:
  intents:
  - istio 流量路由配置
  - virtualservice destinationrule 写法
