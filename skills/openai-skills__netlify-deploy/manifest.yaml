name: openai-skills__netlify-deploy
version: 1.0.0
description: Netlify 部署方法论：检查登录与站点链接状态、按 Git remote 关联或新建站点、判断预览/生产部署、配置 netlify.toml 与构建目录、处理常见登录/构建/发布目录错误，附 CLI 命令与部署模式参考。
delivery: search_result
triggers:
  intents:
  - Netlify 部署流程：先预览还是直发生产
  - netlify.toml 构建命令与发布目录怎么配
  - netlify status 提示未登录或站点未链接怎么办
  - 把 Next.js / Vite 静态站点部署到 Netlify
  - netlify deploy 构建失败或 publish directory not found 排查
  - set up preview deploys and production deploys on Netlify
  aliases:
  - netlify-deploy
  - Netlify 部署
  - netlify.toml 配置
  capabilities:
  - Netlify 部署步骤与链接/新建站点流程
  - 框架默认构建与发布目录表
  - 常见部署错误排查
allowed_tools:
- read_file
entrypoint: SKILL.md
references:
- LICENSE.txt
- SKILL.md
- agents/openai.yaml
- assets/netlify-small.svg
- assets/netlify.png
- references/cli-commands.md
- references/deployment-patterns.md
- references/netlify-toml.md
- LOCAL_NOTES.md
excludes:
- Cloudflare / Vercel / Render 部署
- 本地前端项目搭建
- 域名与 DNS 购买
