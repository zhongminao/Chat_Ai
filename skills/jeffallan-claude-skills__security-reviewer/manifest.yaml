name: jeffallan-claude-skills__security-reviewer
version: 1.1.1
description: Review code and infrastructure for vulnerabilities and produce a severity-rated audit report - secrets scanning, dependency audits, penetration testing findings and remediation guidance.
delivery: search_result
triggers:
  intents:
  - scan a repository for vulnerabilities and leaked secrets
  - write a penetration testing report with CVSS
  - review cloud and infrastructure security posture
  - 安全审计与漏洞扫描
  - 渗透测试报告撰写
  - 密钥泄漏扫描
  - dependency audit and compliance checklist
  - audit findings with CVSS severity rating and remediation
  aliases:
  - security-reviewer
  - 安全审计
  - 漏洞扫描
allowed_tools:
- read_file
entrypoint: SKILL.md
references:
- references/infrastructure-security.md
- references/penetration-testing.md
- references/report-template.md
- references/sast-tools.md
- references/secret-scanning.md
- references/vulnerability-patterns.md
- UPSTREAM_LICENSE
- LOCAL_NOTES.md
excludes:
- 安全编码实现与 OWASP 防护写法
- SAST
- security audit
- security review
