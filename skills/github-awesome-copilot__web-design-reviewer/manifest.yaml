name: github-awesome-copilot__web-design-reviewer
version: 1.0.0
description: 'Visual design QA of an already-running web page: compare layout, spacing, breakpoints, contrast
  and focus states against a checklist, then report each issue with the CSS or template location to fix.'
delivery: search_result
triggers:
  intents:
  - 帮我检查这个本地页面的布局错位和断点问题
  - review the rendered page for responsive breakage and contrast problems
  - 检查页面在小屏和桌面下的对齐、间距、溢出问题
  - 页面视觉验收：找出遮挡、错位、对比度不足的地方
  - visual QA pass on a running site, list design defects with the CSS rule to change
  - 按检查清单核对已上线页面的排版一致性和键盘焦点样式
  aliases:
  - web-design-reviewer
  - 页面视觉验收
  - 布局问题巡检
  capabilities:
  - responsive breakpoint and layout breakage checklist
  - contrast, focus and spacing defect reporting
  - issue-to-source-location mapping for CSS fixes
allowed_tools:
- read_file
entrypoint: SKILL.md
references:
- SKILL.md
- UPSTREAM_LICENSE
- references/framework-fixes.md
- references/visual-checklist.md
- LOCAL_NOTES.md
excludes:
- 从零设计一个新页面的视觉风格
- design tokens and component library architecture
- 查 UI/UX 风格预设与字体搭配
- landing page conversion audit
- 写前端业务代码
